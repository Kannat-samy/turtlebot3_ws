slam_toolbox:
  ros__parameters:

    use_sim_time: true

    mode: mapping

    # Frames (NE PAS METTRE DE NAMESPACE)
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint

    # Laser
    scan_topic: scan
    throttle_scans: 2
    scan_queue_size: 5
    minimum_time_interval: 0.5
    max_laser_range: 3.5

    # TF
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    resolution: 0.05
